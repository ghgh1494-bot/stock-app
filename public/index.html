<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사내 포켓몬 대격돌 RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'DungGeunMo', monospace;
            user-select: none;
        }

        body {
            margin: 0;
            background-color: #2b2b2b;
            color: #111;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 메인 게임 화면 (도감 스타일) */
        #game-container {
            flex: 1;
            background: #dc0a2d;
            border: 8px solid #8b0000;
            display: flex;
            flex-direction: column;
            padding: 15px;
            position: relative;
        }

        /* 포켓몬 도감 상단 램프 연출 */
        .pokedex-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .blue-lamp {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, #80d0ff, #0066cc);
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #0066cc;
        }

        .small-lamp {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid #000;
        }
        .red { background: #ff0000; }
        .yellow { background: #ffcc00; }
        .green { background: #00cc00; }

        /* 게임 메인 스크린 */
        #screen {
            flex: 1;
            background: #8bac0f; /* 게임보이 클래식 액정 색상 */
            border: 6px solid #333;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* 파트너 포켓몬 스테이터스 카트리지 */
        .pokemon-card {
            background: #9bbc0f;
            border: 4px solid #0f380f;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .sprite {
            width: 96px;
            height: 96px;
            image-rendering: pixelated;
        }

        .shiny-glow {
            filter: drop-shadow(0 0 8px #a855f7);
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { filter: drop-shadow(0 0 4px #a855f7); }
            to { filter: drop-shadow(0 0 12px #eab308); }
        }

        .shiny-text {
            color: #7e22ce;
            text-shadow: 1px 1px 0px #fde047;
            font-weight: bold;
        }

        /* 레트로 체력바 */
        .hp-bar-container {
            width: 100%;
            height: 14px;
            background: #0f380f;
            border: 2px solid #0f380f;
            border-radius: 4px;
            overflow: hidden;
        }

        .hp-bar {
            height: 100%;
            background: #306230;
            width: 100%;
            transition: width 0.3s;
        }

        /* 버튼 및 메뉴 그룹 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            background: #f8f8f8;
            border: 4px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 0 #333;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-center { background: #f87171; color: white; }
        .btn-train { background: #fbbf24; }
        .btn-field { background: #4ade80; }

        /* 모달 스타일 */
        .modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            z-index: 10;
        }

        .modal-box {
            background: #fff;
            color: #000;
            border: 6px solid #333;
            border-radius: 10px;
            padding: 20px;
            width: 80%;
            text-align: center;
        }

        /* 우측 실시간 랭킹 사이드바 */
        #sidebar {
            width: 280px;
            background: #1f2937;
            color: white;
            border-left: 4px solid #111;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .user-item {
            background: #374151;
            border: 2px solid #4b5563;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 메인 게임 가젯 -->
    <div id="game-container">
        <div class="pokedex-header">
            <div class="blue-lamp"></div>
            <div class="small-lamp red"></div>
            <div class="small-lamp yellow"></div>
            <div class="small-lamp green"></div>
        </div>

        <div id="screen">
            <!-- 파트너 상태 박스 -->
            <div class="pokemon-card">
                <img id="partner-sprite" class="sprite" src="" alt="포켓몬">
                <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between;">
                        <span id="partner-name" style="font-size: 18px; font-weight: bold;">-</span>
                        <span id="partner-level">Lv.5</span>
                    </div>
                    <div style="margin: 5px 0; font-size: 12px;">
                        HP <span id="hp-text">35/35</span>
                        <div class="hp-bar-container">
                            <div id="hp-bar" class="hp-bar"></div>
                        </div>
                    </div>
                    <div style="font-size: 12px; color: #0f380f;">
                        친밀도: <span id="affinity-text">10.0%</span> | 피로도: <span id="fatigue-text">0%</span>
                    </div>
                </div>
            </div>

            <!-- 자산 상태 -->
            <div style="margin-top: 10px; font-size: 14px; display: flex; justify-content: space-between;">
                <span>💰 골드: <b id="gold-text">10,000</b> G</span>
                <span>🔴 몬스터볼: <b id="ball-text">5</b> 개</span>
            </div>

            <!-- 메인 활동 메뉴 -->
            <div class="menu-grid">
                <div class="btn btn-center" onclick="openModal('center-modal')">🏥 포켓몬 Center</div>
                <div class="btn btn-train" onclick="trainPartner()">🏋️ 훈련소</div>
                <div class="btn" onclick="alert('측정소 오픈 준비중!')">📊 측정소</div>
                <div class="btn btn-field" onclick="exploreField()">🌲 필드 탐험</div>
                <div class="btn" onclick="alert('던전은 하루 무료 2회!')">🏰 던전 입장</div>
                <div class="btn" onclick="alert('보관소 기능 준비중!')">📦 보관소</div>
            </div>
        </div>
    </div>

    <!-- 야생 포획 모달 -->
    <div id="catch-modal" class="modal">
        <div class="modal-box">
            <h3 id="wild-title">야생 포켓몬 등장!</h3>
            <img id="wild-sprite" class="sprite" src="" alt="야생">
            <p id="wild-desc">무엇을 할까?</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn" onclick="throwBall('poke')">🔴 몬스터볼 던지기</button>
                <button class="btn" onclick="closeModal('catch-modal')">🏃 도망치기</button>
            </div>
        </div>
    </div>

    <!-- 우측 실시간 사이드바 -->
    <div id="sidebar">
        <h3>👥 접속 유저 랭킹</h3>
        <div id="user-list"></div>
    </div>

    <script>
        let ws;
        let myData = null;
        let currentWild = null;

        const nickname = prompt("사용할 사원 닉네임을 입력하세요:", "지우") || "사원" + Math.floor(Math.random()*1000);

        function connectWS() {
            ws = new WebSocket(`ws://${location.host}`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'INIT', nickname: nickname }));
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);

                if (data.type === 'STATE_UPDATE' || data.type === 'TRAIN_RESULT') {
                    if (data.msg) alert(data.msg);
                    if (data.user) {
                        myData = data.user;
                        updateUI();
                    }
                }

                if (data.type === 'WILD_SPAWN') {
                    currentWild = data.wild;
                    myData = data.user;
                    updateUI();

                    const isShiny = currentWild.isShiny;
                    document.getElementById('wild-title').innerHTML = isShiny ? 
                        `<span class="shiny-text">✨ [SHINY] 야생 ${currentWild.name}! ✨</span>` : 
                        `야생의 ${currentWild.name}이(가) 나타났다!`;

                    const spriteUrl = isShiny ? 
                        `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${currentWild.id}.png` : 
                        `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${currentWild.id}.png`;

                    const imgEl = document.getElementById('wild-sprite');
                    imgEl.src = spriteUrl;
                    imgEl.className = isShiny ? 'sprite shiny-glow' : 'sprite';

                    document.getElementById('catch-modal').style.display = 'flex';
                }

                if (data.type === 'CATCH_RESULT') {
                    if (data.success) {
                        alert("🎉 신난다! 포켓몬을 잡았다!");
                        closeModal('catch-modal');
                    } else {
                        alert(`흔들림 ${data.shakes}회... 포켓몬이 볼을 깨고 나왔다!`);
                    }
                    if (data.user) {
                        myData = data.user;
                        updateUI();
                    }
                }

                if (data.type === 'SIDEBAR_LIST') {
                    renderSidebar(data.users);
                }
            };
        }

        function updateUI() {
            if (!myData) return;
            const p = myData.partner;
            
            document.getElementById('partner-name').innerHTML = p.isShiny ? `<span class="shiny-text">✨ ${p.name}</span>` : p.name;
            document.getElementById('partner-level').innerText = `Lv.${p.level}`;
            document.getElementById('hp-text').innerText = `${p.hp}/${p.maxHp}`;
            document.getElementById('affinity-text').innerText = `${p.affinity.toFixed(1)}%`;
            document.getElementById('fatigue-text').innerText = `${p.fatigue}%`;
            document.getElementById('gold-text').innerText = myData.gold.toLocaleString();
            document.getElementById('ball-text').innerText = myData.balls.poke;

            const spriteImg = document.getElementById('partner-sprite');
            spriteImg.src = p.isShiny ? 
                `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${p.id}.png` : 
                `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
            spriteImg.className = p.isShiny ? 'sprite shiny-glow' : 'sprite';

            // HP 바
            const hpPercent = (p.hp / p.maxHp) * 100;
            const hpBar = document.getElementById('hp-bar');
            hpBar.style.width = `${hpPercent}%`;
        }

        function renderSidebar(users) {
            const container = document.getElementById('user-list');
            container.innerHTML = '';
            users.sort((a,b) => b.power - a.power).forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `<b>${u.nickname}</b> (${u.location})<br>🔥 전투력: ${u.power}`;
                container.appendChild(div);
            });
        }

        function trainPartner() {
            ws.send(JSON.stringify({ type: 'TRAIN' }));
        }

        function exploreField() {
            ws.send(JSON.stringify({ type: 'EXPLORE_FIELD' }));
        }

        function throwBall(ballType) {
            if (!currentWild) return;
            ws.send(JSON.stringify({
                type: 'CATCH_ATTEMPT',
                ballType: ballType,
                wildHp: currentWild.hp,
                wildMaxHp: currentWild.maxHp,
                baseCatchRate: currentWild.baseCatchRate
            }));
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        connectWS();
    </script>
</body>
</html>
